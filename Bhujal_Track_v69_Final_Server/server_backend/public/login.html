<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GWD Officer Login - Groundwater Monitor</title>
  
  <!-- PWA Theme Color -->
  <meta name="theme-color" content="#0f172a">
  
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Custom Styles (imported styles.css) -->
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Inline specific styles for the login page to guarantee responsive layout and input behavior */
    body.login-page-body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      margin: 0;
      font-family: 'Outfit', sans-serif;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3), 0 0 25px rgba(2, 132, 199, 0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .login-logo {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.35), rgba(0, 242, 254, 0.15));
      border: 1.5px solid rgba(0, 242, 254, 0.4);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      margin: 0;
      line-height: 1.4;
    }

    .form-group-login {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label-login {
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #38bdf8;
      font-size: 1.1rem;
      pointer-events: none;
      z-index: 20;
      user-select: none;
      opacity: 0.85;
    }

    .input-login {
      width: 100%;
      height: 48px;
      background-color: rgba(15, 23, 42, 0.85) !important;
      border: 1px solid rgba(56, 189, 248, 0.25) !important;
      border-radius: 8px !important;
      padding: 0 44px 0 42px !important;
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      caret-color: #38bdf8 !important;
      font-size: 0.95rem !important;
      font-family: inherit !important;
      cursor: text !important;
      pointer-events: auto !important;
      user-select: text !important;
      -webkit-user-select: text !important;
      position: relative;
      z-index: 10;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
      box-sizing: border-box;
    }

    .input-login:focus {
      outline: none !important;
      border-color: #38bdf8 !important;
      background-color: rgba(15, 23, 42, 0.98) !important;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25) !important;
    }

    .input-login::placeholder {
      color: #64748b !important;
      -webkit-text-fill-color: #64748b !important;
      opacity: 0.75 !important;
      font-size: 0.9rem;
    }

    .input-login:-webkit-autofill,
    .input-login:-webkit-autofill:hover, 
    .input-login:-webkit-autofill:focus, 
    .input-login:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #0f172a inset !important;
      -webkit-text-fill-color: #ffffff !important;
      caret-color: #38bdf8 !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 6px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-pass-btn:hover {
      color: #38bdf8;
    }

    .btn-login {
      height: 48px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      margin-top: 4px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #0369a1, #0ea5e9);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.45);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .login-error-banner {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      gap: 10px;
    }

    /* Quick login badges */
    .quick-login-section {
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quick-login-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      text-align: center;
    }

    .quick-login-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .btn-quick-fill {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      color: #38bdf8;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-quick-fill:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #ffffff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="login-page-body">

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="url(#dropletGradLogin)" style="width: 34px; height: 34px; filter: drop-shadow(0 2px 6px rgba(0,180,216,0.5));">
          <defs>
            <linearGradient id="dropletGradLogin" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f2fe" />
              <stop offset="100%" stop-color="#0284c7" />
            </linearGradient>
          </defs>
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
      </div>
      <h1 class="login-title">GWD Portal</h1>
      <p class="login-subtitle">Ground Water Development Department, Odisha</p>
    </div>

    <div class="login-error-banner" id="login-error-alert">
      <span>⚠️</span>
      <span id="login-error-text">Invalid Officer ID or Password.</span>
    </div>

    <form id="frm-gwd-login" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="form-group-login">
        <label for="input-officer-id" class="form-label-login">Officer ID / Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="input-officer-id" 
            class="input-login" 
            placeholder="Enter username (e.g. gwd_officer)" 
            required 
            autocomplete="username" 
            inputmode="text" 
            autocapitalize="none" 
            autocorrect="off" 
            spellcheck="false"
          >
        </div>
      </div>

      <div class="form-group-login">
        <label for="input-officer-password" class="form-label-login">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="input-officer-password" 
            class="input-login" 
            placeholder="Enter password" 
            required 
            autocomplete="current-password"
            autocapitalize="none" 
            autocorrect="off" 
            spellcheck="false"
          >
          <button type="button" class="toggle-pass-btn" id="btn-toggle-password" title="Show or hide password" aria-label="Toggle password visibility">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-submit-login">
        <span>Log In Securely</span>
        <span>➔</span>
      </button>
    </form>

    <!-- 1-Click Quick Fill Credentials Helper -->
    <div class="quick-login-section">
      <div class="quick-login-label">⚡ 1-Click Demo / Quick Logins</div>
      <div class="quick-login-pills">
        <button type="button" class="btn-quick-fill" onclick="fillCreds('gwd_officer', 'gwd_password_2026')">
          👮 Officer (Statewide)
        </button>
        <button type="button" class="btn-quick-fill" onclick="fillCreds('admin', 'admin_password_2026')">
          👑 State Admin
        </button>
        <button type="button" class="btn-quick-fill" onclick="fillCreds('cuttack_div', 'cuttack2026')">
          🏛️ Cuttack Div
        </button>
      </div>
    </div>
  </div>

  <script>
    // Safe wrapper click delegation: only trigger focus if clicking wrapper icon/padding, NOT the input itself
    document.querySelectorAll('.input-wrapper').forEach(wrapper => {
      wrapper.addEventListener('click', (e) => {
        const inp = wrapper.querySelector('input');
        if (inp && e.target !== inp && !e.target.closest('button')) {
          inp.focus();
        }
      });
    });

    // Password show/hide toggle
    const togglePassBtn = document.getElementById('btn-toggle-password');
    if (togglePassBtn) {
      togglePassBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const passInp = document.getElementById('input-officer-password');
        if (passInp.type === 'password') {
          passInp.type = 'text';
          togglePassBtn.textContent = '🙈';
        } else {
          passInp.type = 'password';
          togglePassBtn.textContent = '👁️';
        }
      });
    }

    // 1-Click Fill Credentials Helper
    window.fillCreds = function(username, password) {
      const userInp = document.getElementById('input-officer-id');
      const passInp = document.getElementById('input-officer-password');
      userInp.value = username;
      passInp.value = password;
      document.getElementById('login-error-alert').style.display = 'none';
      userInp.focus();
    };

    // Prevent access if already logged in (Server session cookie checks are primary, sessionStorage is static fallback)
    (function() {
      if (sessionStorage.getItem('gwd_authenticated') === 'true') {
        window.location.href = 'index.html';
      }
    })();

    // Handle form submit
    document.getElementById('frm-gwd-login').onsubmit = async (e) => {
      e.preventDefault();
      
      const rawUser = document.getElementById('input-officer-id').value || '';
      const username = rawUser.trim().toLowerCase();
      const password = document.getElementById('input-officer-password').value || '';
      const errorBanner = document.getElementById('login-error-alert');
      const errorText = document.getElementById('login-error-text');
      const submitBtn = document.getElementById('btn-submit-login');
      
      if (!username || !password) {
        showError("Please enter both Officer ID and Password.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying Credentials...';
      errorBanner.style.display = 'none';

      const divisionMap = {
        "admin": "ALL",
        "gwd_officer": "ALL",
        "admin_cuttack": "CUTTACK DIVISION",
        "cuttack_div": "CUTTACK DIVISION",
        "balasore_div": "BARIPADA DIVISION",
        "baripada_div": "BARIPADA DIVISION",
        "berhampur_div": "BERHAMPUR DIVISION",
        "sambalpur_div": "SAMBALPUR DIVISION",
        "bolangir_div": "BOLANGIR DIVISION",
        "koraput_div": "KORAPUT DIVISION",
        "bhawanipatna_div": "BHAWANIPATNA DIVISION",
        "angul_div": "ANGUL DIVISION",
        "rs_div": "RS DIVISION",
        "ad_hp_div": "AD HP DIVISION",
        "phulbani_div": "PHULBANI DIVISION",
        "rayagada_div": "RAYAGADA DIVISION"
      };

      // 1. Try server API login first (if backend is active)
      try {
        const res = await fetch('api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        if (res.ok) {
          const authData = await res.json();
          const userDiv = authData.division || divisionMap[username] || 'ALL';
          sessionStorage.setItem('gwd_authenticated', 'true');
          sessionStorage.setItem('gwd_username', username);
          sessionStorage.setItem('gwd_user_division', userDiv);
          window.location.href = 'index.html';
          return;
        } else if (res.status === 401) {
          const errData = await res.json();
          showError(errData.message || "Invalid credentials.");
          return;
        }
      } catch (err) {
        console.warn("Server auth endpoint unavailable. Falling back to local offline validator...");
      }

      // 2. Client-side static fallback (offline validator for all GWD Divisions & Admin accounts)
      const validUsers = {
        "admin": "admin_password_2026",
        "gwd_officer": "gwd_password_2026",
        "admin_cuttack": "cuttack_pass_99",
        "cuttack_div": "cuttack2026",
        "balasore_div": "balasore2026",
        "baripada_div": "balasore2026",
        "berhampur_div": "berhampur2026",
        "sambalpur_div": "sambalpur2026",
        "bolangir_div": "bolangir2026",
        "koraput_div": "koraput2026",
        "bhawanipatna_div": "bhawanipatna2026",
        "angul_div": "angul2026",
        "rs_div": "rsdiv2026",
        "ad_hp_div": "adhp2026",
        "phulbani_div": "phulbani2026",
        "rayagada_div": "rayagada_2026"
      };

      if (validUsers[username] && validUsers[username] === password) {
        const userDiv = divisionMap[username] || 'ALL';
        sessionStorage.setItem('gwd_authenticated', 'true');
        sessionStorage.setItem('gwd_username', username);
        sessionStorage.setItem('gwd_user_division', userDiv);
        window.location.href = 'index.html';
      } else {
        showError("Authentication failed. Invalid GWD Officer credentials.");
      }
      
      function showError(msg) {
        errorText.textContent = msg;
        errorBanner.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Log In Securely</span><span>➔</span>';
      }
    };
  </script>

</body>
</html>
