<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GWD Officer Login - Groundwater Monitor</title>
  
  <!-- PWA Theme Color -->
  <meta name="theme-color" content="#0f172a">
  
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Custom Styles (imported styles.css) -->
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Inline specific styles for the login page to guarantee layout */
    body.login-page-body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      margin: 0;
      font-family: 'Outfit', sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      overflow: hidden;
    }

    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.4);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      margin: 0;
    }

    .form-group-login {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label-login {
      font-size: 0.82rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      cursor: text;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 1.1rem;
      pointer-events: none;
      z-index: 20;
    }

    .input-login {
      width: 100%;
      height: 48px;
      background-color: rgba(15, 23, 42, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 8px !important;
      padding: 0 16px 0 42px !important;
      color: #ffffff !important;
      font-size: 0.95rem !important;
      cursor: text !important;
      pointer-events: auto !important;
      user-select: text !important;
      -webkit-user-select: text !important;
      position: relative;
      z-index: 10;
      transition: all 0.2s ease-in-out;
      box-sizing: border-box;
    }

    .input-login:focus {
      outline: none !important;
      border-color: #0284c7 !important;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25) !important;
    }

    .btn-login {
      height: 48px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.3);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .login-error-banner {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body class="login-page-body">

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo" style="background: linear-gradient(135deg, rgba(2, 132, 199, 0.35), rgba(0, 242, 254, 0.15)); border: 1.5px solid rgba(0, 242, 254, 0.4); padding: 4px; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);">
        <img src="assets/logo.png" alt="Bhujal Logo" style="width: 40px; height: 40px; object-fit: contain;" onerror="this.onerror=null; this.src='logo.png';">
      </div>
      <h1 class="login-title">GWD Portal</h1>
      <p class="login-subtitle">Ground Water Development Department, Odisha</p>
    </div>

    <div class="login-error-banner" id="login-error-alert">
      <span>⚠️</span>
      <span id="login-error-text">Invalid Officer ID or Password.</span>
    </div>

    <form id="frm-gwd-login" style="display: flex; flex-direction: column; gap: 20px;">
      <div class="form-group-login">
        <label for="input-officer-id" class="form-label-login">Officer ID / Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="input-officer-id" class="input-login" placeholder="e.g. gwd_officer" required autocomplete="username" autofocus>
        </div>
      </div>

      <div class="form-group-login">
        <label for="input-officer-password" class="form-label-login">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="input-officer-password" class="input-login" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-submit-login">
        <span>Log In Securely</span>
        <span>➔</span>
      </button>
    </form>
  </div>

  <script>
    // Click wrapper to focus input
    document.querySelectorAll('.input-wrapper').forEach(wrapper => {
      wrapper.addEventListener('click', () => {
        const inp = wrapper.querySelector('input');
        if (inp) inp.focus();
      });
    });

    // Prevent access if already logged in (Server session cookie checks are primary, sessionStorage is static fallback)
    (function() {
      if (sessionStorage.getItem('gwd_authenticated') === 'true') {
        window.location.href = 'index.html';
      }
    })();

    // Handle form submit
    document.getElementById('frm-gwd-login').onsubmit = async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('input-officer-id').value.trim();
      const password = document.getElementById('input-officer-password').value;
      const errorBanner = document.getElementById('login-error-alert');
      const errorText = document.getElementById('login-error-text');
      const submitBtn = document.getElementById('btn-submit-login');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying Credentials...';
      errorBanner.style.display = 'none';

      // 1. Try server API login first (if backend is active)
      try {
        const res = await fetch('api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        if (res.ok) {
          sessionStorage.setItem('gwd_authenticated', 'true');
          sessionStorage.setItem('gwd_username', username);
          window.location.href = 'index.html';
          return;
        } else if (res.status === 401) {
          const errData = await res.json();
          showError(errData.message || "Invalid credentials.");
          return;
        }
      } catch (err) {
        console.warn("Server auth endpoint unavailable. Falling back to local offline validator...");
      }

      // 2. Client-side static fallback (uses simple base64/obfuscated comparisons for GitHub Pages)
      // "Z3dkX29mZmljZXI=" is base64 for "gwd_officer"
      // "Z3dkX3Bhc3N3b3JkXzIwMjY=" is base64 for "gwd_password_2026"
      // "YWRtaW5fY3V0dGFjaw==" is base64 for "admin_cuttack"
      // "Y3V0dGFja19wYXNzXzk5" is base64 for "cuttack_pass_99"
      
      const encUser = btoa(username);
      const encPass = btoa(password);
      
      if (
        (encUser === "Z3dkX29mZmljZXI=" && encPass === "Z3dkX3Bhc3N3b3JkXzIwMjY=") ||
        (encUser === "YWRtaW5fY3V0dGFjaw==" && encPass === "Y3V0dGFja19wYXNzXzk5")
      ) {
        sessionStorage.setItem('gwd_authenticated', 'true');
        sessionStorage.setItem('gwd_username', username);
        window.location.href = 'index.html';
      } else {
        showError("Authentication failed. Invalid GWD Officer credentials.");
      }
      
      function showError(msg) {
        errorText.textContent = msg;
        errorBanner.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Log In Securely</span><span>➔</span>';
      }
    };
  </script>

</body>
</html>
